<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sliding Banner Website</title>
    <link rel="stylesheet" href="style.css" />
    
</head>
<body>
     <div class="platform-name" >
        <h1>E -FURNITURE MARKET</h1>
     </div>
    <!-- Dashboard Button -->
    <div class="top-bar">
        <button id="dashboardBtn">☰ Dashboard</button>

        <div id="dashboardMenu" class="dashboard-menu">
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Gallery</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </div>
    </div>

    <!-- Banner Slider -->
    <section class="slider-container">
        <div class="slider" id="slider">
            <div class="slide banner1">
                <h1>Discover the ultimate E-FURNITURE collection</h1>
            </div>
            <div class="slide banner2">
                <h1>Shop our new arrivals</h1>
            </div>

            <div class="slide banner3">
                <h1>Explore our best products</h1>
            </div>
            <!-- Clone of First Slide -->
            <div class="slide banner4">
                <h1>Elevate the everday essentials</h1>
            </div>
        </div>
    </section>

    <!-- Image Grid -->
    <section class="image-grid">

        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="officewares2.png" alt="Image 1">
                </figure>
                <figcaption>OFFICEWARES</figcaption>
            </a>
        </div>

        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="livinghall1.webp" alt="Image 2">
                </figure>
                <figcaption>LIVING HALL</figcaption>
            </a>
        </div>

        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="kitchenwares.webp" alt="Image 3">
                </figure>
                <figcaption>KITCHENWARES</figcaption>
            </a>
        </div>

        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="wardrobes1.webp" alt="Image 4">
                </figure>
                <figcaption>WARDROBES</figcaption>
            </a>
        </div>
       
        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="cafeteria.png" alt="Image 6">
                </figure>
                <figcaption>CAFETERIA</figcaption>
            </a>
        </div>


        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="study space.png" alt="Image 5">
                </figure>
                <figcaption>STUDY SPACE</figcaption>
            </a>
        </div>

       
        <div class="image-card">
            <a href="#" style="text-decoration: none;">
                <figure>
                <img src="storables.jpg" alt="Image 7">
                </figure>
                <figcaption>STORABLES</figcaption>
            </a>
        </div>

        <div class="image-card">
            <a href="#" style=text-decoration:none;>
                <figure>
                <img src="frontdesk1.jpg"  alt="Image 8">
                </figure>
                <figcaption>FRONTDESK</figcaption>
            </a>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
